<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG image preview — Dizzle Digital</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #e8e6e3;
        background: #0f0f12;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: #989498;
        max-width: 36rem;
        text-align: center;
        line-height: 1.5;
      }
      .frame {
        width: min(100%, 960px);
        aspect-ratio: 1200 / 630;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
        background: #1a1a1f;
      }
      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      code {
        font-size: 0.8em;
        color: #c4b8c8;
      }
    </style>
  </head>
  <body>
    <h1>Open Graph preview (1200 × 630)</h1>
    <p>
      Use a dev server so the image resolves (<code>npm run dev</code>), then open this page from the server URL
      (not as a raw file). Or run the app with <code>?ogPreview=1</code>. After <code>npm run generate:og</code>,
      refresh. Deploy path: <code>/og-image.png</code>
    </p>
    <div class="frame">
      <img
        src="./og-image.png"
        width="1200"
        height="630"
        alt="OG composite preview"
        decoding="async"
        fetchpriority="high"
        onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'Could not load og-image.png next to this file — run npm run generate:og, or open via npm run dev (see note above).',style:'padding:1rem;color:#f97316;text-align:center;font-size:14px;line-height:1.5'}))"
      />
    </div>
  </body>
</html>
